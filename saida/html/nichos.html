<!doctype html>
<html lang="pt-BR" data-theme="pergaminho"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Nichos</title><link rel="stylesheet" href="/saida/tokens.css"><link rel="stylesheet" href="/kit/design-system/bundle.css"><style>*,*::before,*::after{box-sizing:border-box;}html,body{margin:0;padding:0;}body{font-family:var(--font-sem-serifa);background:var(--fundo);color:var(--tinta);}.aqr-nicho::before{content:none;}
.gallery {display:grid;grid-template-columns:repeat(2,1080px);width:2160px;gap:0;}
.case {margin:0;width:1080px;overflow:hidden;}
.case-label {height:40px;padding:12px 32px 8px;font:400 14px/20px var(--font-sem-serifa);color:var(--tinta-suave);}
.case-panel {position:relative;width:1080px;background:var(--fundo);color:var(--tinta);}
.seal-panel {height:160px;}
.seal-panel>.aqr-topo {position:absolute;left:var(--espaco-5);top:var(--espaco-5);width:calc(100% - 2*var(--espaco-5));}
.signature-panel {height:180px;}
.signature-panel>.aqr-assinatura {position:absolute;bottom:var(--espaco-5);left:0;width:100%;}
.niche-panel {height:1080px;display:flex;justify-content:center;align-items:flex-start;padding-top:var(--espaco-5);}
.case-panel.aqr-post--cor {background:var(--cor-do-dia);color:var(--sobre-cor);}
</style></head><body><div class="gallery"><section class="case"><div class="case-label">680 × 760 · capela</div><div class="case-panel niche-panel" data-theme="capela" style="--cor-do-dia:var(--liturgico-roxo);background:var(--fundo);"><div class="aqr-nicho" data-element="nicho" style="width:680px;height:760px;"><svg data-element="nicho-filete" data-cor-token="cor-do-dia" viewBox="0 0 680 760" aria-hidden="true" style="position:absolute;inset:0;width:100%;height:100%;color:var(--moldura, var(--cor-do-dia));"><path d="M0 760V340A340 340 0 0 1 680 340V760H677V340A337 337 0 0 0 3 340V760Z" fill="currentColor"/></svg><div class="aqr-nicho__obra" data-element="nicho-recorte"><img src="/saida/obra-provisoria.png" alt="Obra provisória" data-element="nicho-obra" data-arquivo="obra-provisoria.png"></div></div></div></section><section class="case"><div class="case-label">340 × 420 · santinho</div><div class="case-panel niche-panel" data-theme="pergaminho" style="--cor-do-dia:var(--liturgico-roxo);background:var(--papel);"><div class="aqr-nicho" data-element="nicho" style="--moldura:var(--ouro);width:340px;height:420px;"><svg data-element="nicho-filete" data-cor-token="cor-do-dia" viewBox="0 0 340 420" aria-hidden="true" style="position:absolute;inset:0;width:100%;height:100%;color:var(--moldura, var(--cor-do-dia));"><path d="M0 420V170A170 170 0 0 1 340 170V420H337V170A167 167 0 0 0 3 170V420Z" fill="currentColor"/></svg><div class="aqr-nicho__obra" data-element="nicho-recorte"><img src="/saida/obra-provisoria.png" alt="Obra provisória" data-element="nicho-obra" data-arquivo="obra-provisoria.png"></div></div></div></section><section class="case"><div class="case-label">600 × 680 · coragem</div><div class="case-panel niche-panel" data-theme="pergaminho" style="--cor-do-dia:var(--liturgico-roxo);background:var(--fundo);"><div class="aqr-nicho" data-element="nicho" style="width:600px;height:680px;"><svg data-element="nicho-filete" data-cor-token="cor-do-dia" viewBox="0 0 600 680 div></div></section><section class="case"><div class="case-label">600 × 700 · angelus</div><div class="case-panel niche-panel" data-theme="capela" style="--cor-do-dia:var(--liturgico-roxo);background:var(--fundo);"><div class="aqr-nicho" data-element="nicho" style="width:600px;height:700px;"><svg data-element="nicho-filete" data-cor-token="cor-do-dia" viewBox="0 0 600 700" aria-hidden="true" style="position:absolute;inset:0;width:100%;height:100%;color:var(--moldura, var(--cor-do-dia));"><path d="M0 700V300A300 300 0 0 1 600 300V700H597V300A297 297 0 0 0 3 300V700Z" fill="currentColor"/></svg><div class="aqr-nicho__obra" data-element="nicho-recorte"><img src="/saida/obra-provisoria.png" alt="Obra provisória" data-element="nicho-obra" data-arquivo="obra-provisoria.png"></div></div></div></section></div></body></html>
