# Para Rezar · orações
# Cada item de "partes" é um card. Uma parte = card único; duas ou mais = carrossel.
# Em >- as quebras de linha do YAML não contam: o texto vira um parágrafo só.

# Modelo do design system: é o card da prévia do kit e não vai ao ar.
# Serve para conferir o card único (título, oração e origem no mesmo card).
- data: 2026-10-20
  cor: verde
  titulo: Oração a São Miguel Arcanjo
  intencao: para pedir proteção
  origem: Papa Leão XIII, 1886
  partes:
    - >-
      São Miguel Arcanjo, defendei-nos no combate; sede o nosso refúgio
      contra as maldades e ciladas do demônio. Ordene-lhe Deus,
      instantemente o pedimos; e vós, príncipe da milícia celeste, pela
      virtude divina, precipitai no inferno a Satanás e aos outros
      espíritos malignos que andam pelo mundo para perder as almas. Amém.

- data: 2026-12-15
  cor: roxo
  titulo: Ato de Contrição
  intencao: para a confissão
  origem: Oração tradicional
  partes:
    - >-
      Senhor meu Jesus Cristo, Deus e homem verdadeiro, Criador e Redentor
      meu: por serdes vós quem sois, sumamente bom e digno de ser amado
      sobre todas as coisas, e porque vos amo e estimo, pesa-me, Senhor,
      de todo o meu coração, de vos ter ofendido;
    - >-
      pesa-me também de ter perdido o céu e merecido o inferno; e proponho
      firmemente, ajudado com o auxílio de vossa divina graça, emendar-me
      e nunca mais vos tornar a ofender. Espero alcançar o perdão de
      minhas culpas pela vossa infinita misericórdia. Amém.

- data: 2026-12-29
  cor: ouro
  titulo: Oração antes de viajar
  intencao: para pôr a viagem nas mãos de Deus
  origem: Salmo 120 (121), cântico das peregrinações
  partes:
    - >-
      Para os montes levanto os olhos: de onde me virá socorro? O meu socorro
      virá do Senhor, criador do céu e da terra. Ele não permitirá que teus pés
      resvalem; não dormirá aquele que te guarda. Não, não há de dormir, nem
      adormecer o guarda de Israel.
    - >-
      O Senhor é teu guarda, o Senhor é teu abrigo, sempre ao teu lado. De dia,
      o sol não te fará mal; nem a lua durante a noite. O Senhor te resguardará
      de todo o mal; ele velará sobre tua alma. O Senhor guardará os teus
      passos, agora e para todo o sempre.

- data: 2026-12-31
  cor: ouro
  titulo: Te Deum
  intencao: para agradecer o ano que termina
  origem: Hino Te Deum, na Liturgia das Horas
  partes:
    - >-
      A vós, ó Deus, louvamos, a vós, Senhor, cantamos. A vós, Eterno Pai,
      adora toda a terra. A vós cantam os anjos, os céus e seus poderes: Sois
      Santo, Santo, Santo, Senhor, Deus do universo! Proclamam céus e terra a
      vossa imensa glória. A vós celebra o coro glorioso dos Apóstolos, vos
      louva dos Profetas a nobre multidão e o luminoso exército dos vossos
      santos Mártires.
    - >-
      A vós por toda a terra proclama a Santa Igreja, ó Pai onipotente, de
      imensa majestade, e adora juntamente o vosso Filho único, Deus vivo e
      verdadeiro, e ao vosso Santo Espírito. Ó Cristo, Rei da glória, do Pai
      eterno Filho, nascestes duma Virgem, a fim de nos salvar. Sofrendo vós a
      morte, da morte triunfastes abrindo aos que têm fé dos céus o reino
      eterno. Sentastes à direita de Deus, do Pai na glória. Nós cremos que de
      novo vireis como juiz. Portanto, vos pedimos: salvai os vossos servos,
      que vós, Senhor, remistes com sangue precioso.
    - >-
      Fazei-nos ser contados, Senhor, vos suplicamos, em meio a vossos santos
      na vossa eterna glória. Salvai o vosso povo. Senhor, abençoai-o.
      Regei-nos e guardai-nos até a vida eterna. Senhor, em cada dia, fiéis,
      vos bendizemos, louvamos vosso nome agora e pelos séculos. Dignai-vos,
      neste dia, guardar-nos do pecado. Senhor, tende piedade de nós, que a
      vós clamamos. Que desça sobre nós, Senhor, a vossa graça, porque em vós
      pusemos a nossa confiança. Fazei que eu, para sempre, não seja
      envergonhado: Em vós, Senhor, confio, sois vós minha esperança!

- data: 2027-01-05
  cor: ouro
  titulo: À vossa proteção
  intencao: para se pôr sob o cuidado de Maria
  origem: Sub tuum praesidium, a mais antiga oração a Nossa Senhora
  partes:
    - >-
      À vossa proteção recorremos, santa Mãe de Deus; não desprezeis as
      nossas súplicas em nossas necessidades, mas livrai-nos sempre de todos
      os perigos, ó Virgem gloriosa e bendita. Amém.
