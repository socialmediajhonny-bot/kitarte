# Toda Bela · aos sábados, a Ladainha de Nossa Senhora, invocação por invocação
# Três cards: a capa com a obra e a invocação, de onde vem e para rezar hoje.
# Em |- cada linha é uma quebra manual; em >- as quebras do YAML não contam.

- data: 2026-12-12
  cor: ouro
  info: Ladainha 1
  invocacao: Santa Maria
  obra:
    arquivo: obras/toda-bela/2026-12-12.jpg
    credito: Sassoferrato · A Virgem em oração · National Gallery, Londres
    pagina: https://www.nationalgallery.org.uk/paintings/sassoferrato-the-virgin-in-prayer
    foco: 50% 30%
    zoom: 1.08
  raiz:
    rotulo: De onde vem
    versiculo: E o nome da virgem era Maria.
    referencia: Lc 1,27
    texto: >-
      É a primeira invocação a Nossa Senhora na Ladainha: o nome dela e uma
      palavra, santa. O Oriente cristão a chama de Panaghia, a toda santa,
      porque, pela graça de Deus, ela viveu livre de todo pecado.
    fonte: Catecismo da Igreja Católica, 493
  oracao:
    rotulo: Para rezar hoje
    frase: |-
      Santa Maria,
      rogai por nós.
    convite: Salve e reze com a gente, uma invocação de cada vez.

- data: 2026-12-26
  cor: vermelho
  info: Ladainha 2
  invocacao: Santa Mãe de Deus
  obra:
    arquivo: obras/toda-bela/2026-12-26.jpg
    credito: Ícone bizantino, séc. XII · Virgem de Vladimir · Galeria Tretyakov, Moscou
    pagina: https://commons.wikimedia.org/wiki/File:Vladimirskaja_ikona_Bo%C5%BEiej_Materi.jpg
    foco: 53% 38%
    zoom: 1.9
  raiz:
    rotulo: De onde vem
    versiculo: Donde me vem esta honra de vir a mim a mãe de meu Senhor?
    referencia: Lc 1,43
    texto: >-
      Isabel chama Maria de mãe do seu Senhor. Em 431, o Concílio de Éfeso
      proclamou que ela é, com toda a verdade, Mãe de Deus: o Filho que ela
      concebeu é o Filho eterno do Pai.
    fonte: Catecismo da Igreja Católica, 466 e 495
  oracao:
    rotulo: Para rezar hoje
    frase: |-
      Santa Mãe de Deus,
      rogai por nós.
    convite: Dia 1º, solenidade da Mãe de Deus. Reze com a gente.

- data: 2027-01-02
  cor: ouro
  info: Ladainha 3
  invocacao: Santa Virgem das virgens
  obra:
    arquivo: obras/toda-bela/2027-01-02.jpg
    credito: Antonello da Messina · A Virgem da Anunciação · Palazzo Abatellis, Palermo
    pagina: https://commons.wikimedia.org/wiki/File:Antonello_da_Messina,_Annunciata_di_Palermo,_circa_1475-77_-FG2.jpg
    foco: 50% 32%
    zoom: 1.1
  raiz:
    rotulo: De onde vem
    versiculo: Eis que a virgem conceberá e dará à luz um filho.
    referencia: Mt 1,23
    texto: >-
      A Igreja crê que Maria concebeu Jesus pelo poder do Espírito Santo e
      permaneceu virgem a vida inteira. Por isso a liturgia a chama de sempre
      Virgem.
    fonte: Catecismo da Igreja Católica, 496 e 499
  oracao:
    rotulo: Para rezar hoje
    frase: |-
      Santa Virgem das virgens,
      rogai por nós.
    convite: Amanhã, Epifania do Senhor. Reze com a gente.

- data: 2027-01-09
  cor: ouro
  info: Ladainha 4
  invocacao: Mãe de Cristo
  obra:
    arquivo: obras/toda-bela/2027-01-09.jpg
    credito: Rafael · Madona della Seggiola · Palazzo Pitti, Florença
    pagina: https://commons.wikimedia.org/wiki/File:Raphael_Madonna_della_seggiola.jpg
    foco: 45% 40%
    zoom: 1.3
  raiz:
    rotulo: De onde vem
    versiculo: Hoje, na cidade de Davi, nasceu para vós um Salvador, que é o Cristo Senhor.
    referencia: Lc 2,11
    texto: >-
      Cristo quer dizer Ungido: o Messias que Israel esperava. O anjo anunciou
      aos pastores que o menino nascido de Maria é o Cristo. Ela é a mãe do
      Ungido de Deus.
    fonte: Catecismo da Igreja Católica, 436 e 437
  oracao:
    rotulo: Para rezar hoje
    frase: |-
      Mãe de Cristo,
      rogai por nós.
    convite: Amanhã, Batismo do Senhor. Reze com a gente.
