# Stories avulsos · cada story é renderizado uma vez, na composição do StoryAngelus.
# O selo é "serie · apoio" (ex.: "Rezo por Você · sáb, 12 dez"). O crédito da obra fica na ficha, não na arte.
# Cada grupo vira um PDF, com os stories na ordem do YAML. Em |- cada linha é uma quebra manual.

- id: terco-2026-12-12
  grupo: terco-2026-12-12
  cor: roxo
  serie: Rezo por Você
  apoio: sáb, 12 dez
  titulo: Terço pelas intenções
  subtitulo: Hoje, os mistérios gozosos, por tudo o que vocês pediram
  invocacao: |-
    Santa Maria, Mãe de Deus,
    rogai por nós, pecadores,
    agora e na hora de nossa morte. Amém.
  obra:
    arquivo: obras/stories/terco.jpg
    credito: Bartolomé Esteban Murillo · A Virgem do Rosário · Museu do Prado
    pagina: https://commons.wikimedia.org/wiki/File:Virgen_del_Rosario_(Murillo).jpg
    foco: 50% 35%
    zoom: 1.15

