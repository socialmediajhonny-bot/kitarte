    credito: Bartolomé Esteban Murillo · A Virgem do Rosário · Museu do Prado
    pagina: https://commons.wikimedia.org/wiki/File:Virgen_del_Rosario_(Murillo).jpg
    foco: 50% 35%
    zoom: 1.15

