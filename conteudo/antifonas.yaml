# Antífonas do Ó · de 17 a 23/12, às 9h, no lugar do Santo do Dia
# Três cards: a capa com a obra e o título, de onde vem e para rezar hoje (a antífona inteira).
# Antífonas: Liturgia das Horas usada no Brasil, antífona do Magnificat nas Vésperas do dia.
# A 4ª (Ó Chave de Davi, 20/12) vai nos stories avulsos. Em >- as quebras do YAML não contam.

- data: 2026-12-17
  cor: roxo
  info: 1ª de 7
  titulo: Ó Sabedoria
  obra:
    arquivo: obras/antifonas/2026-12-17.jpg
    credito: Auvergne, séc. XII · Virgem com o Menino em majestade · The Met, Nova York
    pagina: https://commons.wikimedia.org/wiki/File:Enthroned_Virgin_and_Child_MET_DP102902.jpg
    foco: 50% 40%
    zoom: 1.4
  raiz:
    rotulo: De onde vem
    versiculo: Saí da boca do Altíssimo; nasci antes de toda criatura.
    referencia: Eclo 24,5
    texto: >-
      De 17 a 23 de dezembro, as Vésperas cantam sete antífonas que chamam
      Cristo por nomes do Antigo Testamento. A primeira é Sabedoria, que saiu
      da boca de Deus e governa todas as coisas.
    fonte: Liturgia das Horas · Eclo 24,5 · Sb 8,1
  oracao:
    rotulo: Para rezar hoje
    antifona: >-
      Ó Sabedoria, que saístes da boca do Altíssimo, e atingis até os confins
      de todo o universo e com força e suavidade governais o mundo inteiro:
      oh vinde ensinar-nos o caminho da prudência!
    fonte: Liturgia das Horas · Antífona do Magnificat, 17 de dezembro
    convite: "Amanhã, às 9h: Ó Adonai."

- data: 2026-12-18
  cor: roxo
  info: 2ª de 7
  titulo: Ó Adonai
  obra:
    arquivo: obras/antifonas/2026-12-18.jpg
    credito: Dieric Bouts (atrib.) · Moisés e a sarça ardente · Philadelphia Museum of Art
    pagina: https://commons.wikimedia.org/wiki/File:Attributed_to_Dierick_Bouts_the_Elder,_Netherlandish_(active_Louvain),_first_securely_documented_1447,_died_1475_-_Moses_and_the_Burning_Bush,_with_Moses_Removing_His_Shoes_-_Google_Art_Project.jpg
    foco: 40% 50%
  raiz:
    rotulo: De onde vem
    versiculo: Eu sou aquele que sou.
    referencia: Ex 3,14
    texto: >-
      Na sarça ardente, Deus revelou seu nome a Moisés. Por respeito, Israel
      não o pronuncia: na leitura, diz Adonai, Senhor. É com esse título que a
      Igreja aclama Jesus: Jesus é o Senhor.
    fonte: Ex 3,2-15 · Catecismo da Igreja Católica, 209
  oracao:
    rotulo: Para rezar hoje
    antifona: >-
      Ó Adonai, guia da casa de Israel, que aparecestes a Moisés na sarça
      ardente e lhe destes vossa lei sobre o Sinai: vinde salvar-nos com o
      braço poderoso!
    fonte: Liturgia das Horas · Antífona do Magnificat, 18 de dezembro
    convite: "Amanhã, às 9h: Ó Raiz de Jessé."

- data: 2026-12-19
  cor: roxo
  info: 3ª de 7
  titulo: Ó Raiz de Jessé
  obra:
    arquivo: obras/antifonas/2026-12-19.jpg
    credito: Vitral alemão, séc. XIII · A Árvore de Jessé · The Met, Nova York
    pagina: https://commons.wikimedia.org/wiki/File:Tree_of_Jesse_Window-_The_Reclining_Jesse,_King_David,_and_Scenes_from_the_Life_of_Jesus_MET_DP275861.jpg
    janela: [584, 600, 845]
    tamanho: [2000, 1683]
  raiz:
    rotulo: De onde vem
    versiculo: Um renovo sairá do tronco de Jessé, e um rebento brotará de suas raízes.
    referencia: Is 11,1
    texto: >-
      Jessé era o pai do rei Davi. Isaías anuncia que da sua raiz brotaria um
      rebento, posto como estandarte para os povos. São Paulo lê a profecia
      como anúncio de Cristo.
    fonte: Is 11,1.10 · Mt 1,5-6 · Rm 15,12
  oracao:
    rotulo: Para rezar hoje
    antifona: >-
      Ó Raiz de Jessé, ó estandarte, levantado em sinal para as nações! Ante
      vós se calarão os reis da terra, e as nações implorarão misericórdia:
      Vinde salvar-nos! Libertai-nos sem demora!
    fonte: Liturgia das Horas · Antífona do Magnificat, 19 de dezembro
    convite: "Domingo, nos Stories: Ó Chave de Davi."

- data: 2026-12-21
  cor: roxo
  info: 5ª de 7
  titulo: Ó Sol nascente
  obra:
    arquivo: obras/antifonas/2026-12-21.jpg
    credito: Correggio · A Noite Santa · Gemäldegalerie Alte Meister, Dresden
    pagina: https://commons.wikimedia.org/wiki/File:Correggio_-_The_Holy_Night_-_Google_Art_Project.jpg
    foco: 62% 60%
    zoom: 1.2
  raiz:
    rotulo: De onde vem
    versiculo: A visita do Sol nascente, que há de iluminar os que jazem nas trevas e na sombra da morte.
    referencia: Lc 1,78-79
    texto: >-
      Quando nasce João Batista, seu pai, Zacarias, bendiz a Deus e anuncia o
      Sol que vem do alto. O profeta Malaquias já falava do sol de justiça,
      que traz a salvação em seus raios.
    fonte: Lc 1,67-79 · Ml 3,20
  oracao:
    rotulo: Para rezar hoje
    antifona: >-
      Ó Sol nascente justiceiro, resplendor da Luz eterna: Oh, vinde e
      iluminai os que jazem entre as trevas e, na sombra do pecado e da
      morte, estão sentados.
    fonte: Liturgia das Horas · Antífona do Magnificat, 21 de dezembro
    convite: "Amanhã, às 9h: Ó Rei das nações."

- data: 2026-12-22
  cor: roxo
  info: 6ª de 7
  titulo: Ó Rei das nações
  obra:
    arquivo: obras/antifonas/2026-12-22.jpg
    credito: Quentin Metsys · Salvator Mundi · Museo Correr, Veneza
    pagina: https://commons.wikimedia.org/wiki/File:(Venice)_Salvator_Mundi_-_Quentin_Metsys_-_Museo_Correr.jpg
    foco: 50% 90%
  raiz:
    rotulo: De onde vem
    versiculo: Porque é ele a nossa paz, ele que de dois povos fez um só.
    referencia: Ef 2,14
    texto: >-
      Jeremias chama Deus de rei dos povos. São Paulo vê em Cristo a pedra
      angular, que de dois povos fez um só. A antífona lembra ainda o barro de
      que Deus formou o homem.
    fonte: Jr 10,7 · Ef 2,14.20 · Gn 2,7
  oracao:
    rotulo: Para rezar hoje
    antifona: >-
      Ó Rei das nações, Desejado dos povos; ó Pedra angular, que os opostos
      unis: Oh, vinde e salvai este homem tão frágil, que um dia criastes do
      barro da terra!
    fonte: Liturgia das Horas · Antífona do Magnificat, 22 de dezembro
    convite: "Amanhã, às 9h: Ó Emanuel."

- data: 2026-12-23
  cor: roxo
  info: 7ª de 7
  titulo: Ó Emanuel
  obra:
    arquivo: obras/antifonas/2026-12-23.jpg
    credito: Rafael · A Pequena Madona Cowper · National Gallery of Art, Washington
    pagina: https://commons.wikimedia.org/wiki/File:Raphael,_The_Small_Cowper_Madonna,_c._1505,_NGA_1196.jpg
    foco: 50% 25%
    zoom: 1.1
  raiz:
    rotulo: De onde vem
    versiculo: Uma virgem conceberá e dará à luz um filho, e o chamará ‘Deus Conosco’.
    referencia: Is 7,14
    texto: >-
      Isaías anunciou o sinal, e São Mateus o viu cumprido no nascimento de
      Jesus: Emanuel quer dizer Deus conosco. É a última antífona antes do
      Natal.
    fonte: Is 7,14 · Mt 1,22-23
  oracao:
    rotulo: Para rezar hoje
    antifona: >-
      Ó Emanuel: Deus-conosco, nosso Rei Legislador, Esperança das nações e
      dos povos Salvador: Vinde enfim para salvar-nos, ó Senhor e nosso Deus!
    fonte: Liturgia das Horas · Antífona do Magnificat, 23 de dezembro
    convite: Amanhã é véspera de Natal. Vinde, Senhor Jesus!
