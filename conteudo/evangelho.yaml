    zoom: 1.12
  trecho: Agora, Senhor, conforme a tua promessa, podes deixar teu servo partir em paz; porque meus olhos viram a tua salvação.
  trecho_ref: Lc 2,29-30
  pergunta: Onde eu já vi a salvação de Deus agindo na minha vida?

- data: 2026-12-30
  celebracao: 6º dia na Oitava do Natal
  cor: ouro
  referencia: Lc 2,36-40
  titulo: Ana, a viúva que não saía do Templo
  obra:
    arquivo: obras/2026-12-30.jpg
