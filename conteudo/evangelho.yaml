  trecho_ref: Mt 2,13
  pergunta: Quem eu posso proteger hoje, como José protegeu o menino e sua mãe?

- data: 2026-12-29
  celebracao: 5º dia na Oitava do Natal
  cor: ouro
  referencia: Lc 2,22-35
  titulo: Simeão toma o menino nos braços
  obra:
    arquivo: obras/2026-12-29.jpg
