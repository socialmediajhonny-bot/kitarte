- data: 2026-12-27
  celebracao: Sagrada Família de Jesus, Maria e José (Festa)
  cor: ouro
  referencia: Lc 2,22-40
  titulo: Maria e José levam o menino ao Templo
  obra:
    arquivo: obras/2026-12-27.jpg
    credito: Andrea Mantegna · A Apresentação no Templo · Gemäldegalerie, Berlim
    pagina: https://commons.wikimedia.org/wiki/File:Andrea_Mantegna_-_The_Presentation_-_Google_Art_Project.jpg
    foco: 45% 50%
    zoom: 1.1
  trecho: O menino crescia e tornava-se forte, cheio de sabedoria; e a graça de Deus estava com ele.
  trecho_ref: Lc 2,40
  reflexao:
    titulo: Deus quis crescer numa família
    texto: >-
      No domingo depois do Natal, a Igreja celebra a Sagrada Família. Maria
      e José apresentam o menino no Templo com a oferta dos pobres, duas
      rolinhas ou dois pombinhos. Depois, em Nazaré, o Filho de Deus cresce
      numa casa simples.
  pergunta: O que a minha família pode fazer junta para crescer na graça de Deus?

- data: 2026-12-28
  celebracao: Santos Inocentes, mártires (Festa)
  cor: vermelho
  referencia: Mt 2,13-18
  titulo: José foge com a família para o Egito
  obra:
    arquivo: obras/2026-12-28.jpg
