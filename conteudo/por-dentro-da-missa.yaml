# Por Dentro da Missa · às quintas, o porquê do que se vê na Missa
# Cards: a capa com a pergunta, de uma a três explicações e o fecho na cor do dia.
# Em |- cada linha é uma quebra manual; em >- as quebras do YAML não contam.

- data: 2026-12-10
  cor: roxo
  capa:
    pergunta: Por que o padre veste roxo?
    resposta: E por que, no domingo, ele pode aparecer de rosa.
  explicacoes:
    - rotulo: O que a cor diz
      titulo: "Roxo: tempo de preparação"
      # A fórmula entre aspas é a do Missal Romano (Normas Universais sobre o Ano Litúrgico e o Calendário, 39).
      texto: >-
        A cor das vestes mostra o mistério que se celebra e o caminho do ano
        litúrgico. O roxo é usado no Advento e na Quaresma. No Advento, a
        Igreja se prepara para o Natal e para a volta de Cristo: é um “tempo de
        piedosa e alegre expectativa”.
      fonte: |-
        Instrução Geral do Missal Romano, 345-346
        Normas Universais sobre o Ano Litúrgico e o Calendário, 39
    - rotulo: No 3º Domingo do Advento
      titulo: "Rosa: o domingo Gaudete"
      texto: >-
        Gaudete quer dizer “alegrai-vos”. O nome vem da antífona de entrada da
        Missa desse domingo: “Alegrai-vos sempre no Senhor!” (Fl 4,4). Onde for
        costume, o padre pode vestir rosa nesse dia.
      fonte: |-
        Bento XVI, Ângelus de 14/12/2008 · Francisco, Ângelus de 13/12/2020
        Instrução Geral do Missal Romano, 346
  fecho:
    rotulo: Para reparar no domingo
    frase: Repare na cor das vestes do padre e na vela rosa da coroa do Advento.
    convite: Salve e envie para quem vai à Missa com você.
